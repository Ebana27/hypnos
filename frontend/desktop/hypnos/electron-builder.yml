appId: com.hypnos.app
# Ne plus changer ce nom après la première installation : Electron s'en sert
# pour nommer le dossier des données (la base locale de l'utilisateur).
productName: Hypnos
directories:
  # resources/icon.png sert d'icône : electron-builder la convertit
  # en .ico pour Windows et en .icns pour macOS.
  buildResources: resources
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!verifier-imports.mjs'
  - '!local.db*'
  - '!drizzle.config.*'
  # Les migrations sont copiées à part (extraResources) : inutile de les mettre aussi dans l'archive
  - '!drizzle/**'
asarUnpack:
  - resources/**
  - node_modules/@libsql/**
extraResources:
  - from: drizzle
    to: drizzle
win:
  executableName: hypnos
  icon: resources/icon.png
  target:
    - target: nsis
      arch:
        - x64
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  icon: resources/icon.png
  category: public.app-category.business
  entitlementsInherit: resources/entitlements.mac.plist
  target:
    # Le .zip est nécessaire aux mises à jour automatiques sur macOS
    - dmg
    - zip
  extendInfo:
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
compression: maximum
electronLanguages:
  - fr
  - en-US
publish:
  provider: github
  owner: Ebana27
  repo: hypnos-update-history
  releaseType: release